apiVersion: apps/v1
kind: Deployment
metadata:
  name: task-backend
  namespace: task-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: task-backend
  template:
    metadata:
      labels:
        app: task-backend
    spec:
      containers:
        - name: task-backend
          image: sen5e1/task-backend:1.0
          ports:
            - containerPort: 3000
          envFrom:
            - secretRef:
                name: task-app-secrets
