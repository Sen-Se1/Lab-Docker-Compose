apiVersion: apps/v1
kind: Deployment
metadata:
  name: task-frontend
  namespace: task-app
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: task-app
      component: frontend
  template:
    metadata:
      labels:
        app: task-app
        component: frontend
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
      containers:
        - name: task-frontend
          image: sen5e1/task-frontend:1.1
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 30
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          env:
            - name: API_URL
              valueFrom:
                secretKeyRef:
                  name: task-app-secrets
                  key: API_URL
