apiVersion: apps/v1
kind: Deployment
metadata:
  name: task-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: task-frontend
  template:
    metadata:
      labels:
        app: task-frontend
    spec:
      containers:
        - name: task-frontend
          image: sen5e1/task-frontend:1.0
          ports:
            - containerPort: 80
          env:
            - name: API_URL
              value: http://task-backend:3000

---
apiVersion: v1
kind: Service
metadata:
  name: task-frontend
spec:
  selector:
    app: task-frontend
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30081
  type: NodePort