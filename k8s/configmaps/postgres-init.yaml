apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init-sql
  namespace: task-app
  labels:
    app: task-app
    component: database
data:
  init.sql: |
    CREATE TABLE IF NOT EXISTS tasks (
        id SERIAL PRIMARY KEY,
        title VARCHAR(255) NOT NULL,
        description TEXT,
        status VARCHAR(50) DEFAULT 'pending',
        created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
    );
